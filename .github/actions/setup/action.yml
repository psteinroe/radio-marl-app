name: Setup Repo
description: Prepare and install everything for the repo

inputs:
  github-token:
    description: The GitHub token

  bun-version:
    description: Version of Bun to use
    default: latest

  eas-version:
    description: Version of EAS CLI to use
    default: latest

  expo-version:
    description: Version of Expo CLI to use
    default: latest

  expo-token:
    description: Expo token to authenticate with
    required: false

runs:
  using: composite
  steps:
    - name: 🏗 Setup Bun
      uses: oven-sh/setup-bun@v1
      with:
        version: ${{ inputs.bun-version }}

    - name: 🏗 Setup Expo
      if: ${{ inputs.expo-token }}
      uses: expo/expo-github-action@v8
      with:
        eas-version: ${{ inputs.eas-version }}
        expo-version: ${{ inputs.expo-version }}
        token: ${{ inputs.expo-token }}
        packager: bun

    - name: 📦 Install dependencies
      run: bun install
