name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 🏗 Setup repository
        uses: actions/checkout@v7

      - name: 🏗 Setup repo
        uses: ./.github/actions/setup

      - name: ✅ Validate
        run: pnpm run validate
